        #scrollPopup {
            position: fixed;

<body class="pb-20">

    <div class="w-full flex justify-center pb-2 bg-[#f8fafc]" style="padding-top: calc(env(safe-area-inset-top) + 1.5rem);">
        <h1 class="text-2xl md:text-4xl font-extrabold text-[#204c8a] whitespace-nowrap tracking-tight text-center drop-shadow-sm cursor-pointer" onclick="location.reload();">

    <header class="sticky-search-header px-4 md:px-8 shadow-sm">

        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 md:px-8 mt-6 relative">
        <div id="listContainer" class="space-y-12">
            <!-- 리스트 컨텐츠 영역 -->
        </div>
    </main>

    <div id="scrollPopup">
        <span id="popupDate">DAY -</span>
        <div class="drag-dots">
            <span></span><span></span><span></span>
        </div>
    </div>

    <script>
        // 모바일 브라우저의 자체 스크롤 복원 기능을 수동(manual)으로 변경
        if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }

        // [추가] 리프레시 직전에 현재 화면의 정확한 스크롤 픽셀 위치를 기억해 둠
        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem('exactScrollY', window.scrollY);
        });

        // 새로고침 시 최초 한 번만 스크롤을 복원하기 위한 플래그
        let hasRestoredScroll = false;

        // 1. 아이콘 제거 및 자동 스크롤 복원 Observer
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.addedNodes.length) {
                    const walker = document.createTreeWalker(
                        document.getElementById('listContainer'),
                        NodeFilter.SHOW_TEXT,
                        null,
                        false
                    );
                    let node;
                    while ((node = walker.nextNode())) {
                        if (node.nodeValue.includes('💬') || node.nodeValue.includes('🗨️')) {
                            node.nodeValue = node.nodeValue.replace(/[💬🗨️]/g, '').trim();
                        }
                    }

                    // [수정] 컨텐츠가 로드되었을 때 위치 복원 (픽셀 단위 고정 우선 적용)
                    if (!hasRestoredScroll) {
                        const exactScrollY = sessionStorage.getItem('exactScrollY');
                        const savedDay = sessionStorage.getItem('lastStudiedDay');

                        if (exactScrollY !== null) {
                            // 리프레시 후: 기억해둔 좌표로 딜레이 없이 그 자리 그대로 고정
                            setTimeout(() => {
                                window.scrollTo(0, parseInt(exactScrollY, 10));
                            }, 50);
                        } else if (savedDay) {
                            // 최초 로드 시 (exactScrollY가 없을 때): 마지막 학습 DAY 박스로 이동
                            setTimeout(() => {
                                const items = Array.from(listContainer.children);
                                const targetItem = items.find(item => {
                                    const regex = new RegExp(`DAY\\s*${savedDay}(?!\\d)`, 'i');
                                    return regex.test(item.textContent);
                                });

                                if (targetItem) {
                                    targetItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                }
                            }, 300);
                        }
                        hasRestoredScroll = true; // 복원 완료 처리
                    }
                }
            });
        });
        
        const listContainer = document.getElementById('listContainer');
        if (listContainer) {
            observer.observe(listContainer, { childList: true, subtree: true });
        }

        // 2. 텍스트 검색 기능
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            const items = Array.from(listContainer.children);

            items.forEach(item => {
                const textContent = item.textContent.toLowerCase();
                if (textContent.includes(keyword)) {
                    item.style.display = '';
                } else {
                    item.style.display = 'none';
                }
            });
        });

        // 3. 커스텀 스크롤 기능
        const scrollPopup = document.getElementById('scrollPopup');
        const popupDate = document.getElementById('popupDate');
        let isDragging = false;

        function updatePopupDate() {
            const items = Array.from(listContainer.children);
            let closestItem = null;
            let minDistance = Infinity;

            items.forEach(item => {
                if (item.style.display === 'none') return;
                
                const rect = item.getBoundingClientRect();
                const distance = Math.abs(rect.top - (window.innerHeight / 2));
                
                if (distance < minDistance) {
                    minDistance = distance;
                    closestItem = item;
                }
            });

            if (closestItem) {
                const dayMatch = closestItem.textContent.match(/DAY\s*(\d+)/i);
                if (dayMatch) {
                    const dayNumber = parseInt(dayMatch[1], 10);
                    
                    // 화면 중앙에 위치한 DAY 숫자를 세션 스토리지에 저장
                    sessionStorage.setItem('lastStudiedDay', dayNumber);

                    const baseDate = new Date('2025-12-30T00:00:00');
                    baseDate.setDate(baseDate.getDate() + dayNumber);
                    
                    const yyyy = baseDate.getFullYear();
                    const mm = String(baseDate.getMonth() + 1).padStart(2, '0');
                    const dd = String(baseDate.getDate()).padStart(2, '0');
                    
                    popupDate.textContent = `${yyyy}-${mm}-${dd}`;
                } else {
                    popupDate.textContent = "STUDY"; 
                }
            }
        }

        function updatePopupPosition() {
            if (isDragging) return;
            const scrollableHeight = document.documentElement.scrollHeight - window.innerHeight;
            if (scrollableHeight <= 0) return;
            
            const scrollPercent = window.scrollY / scrollableHeight;
            const topPos = 15 + (scrollPercent * 70); 
            scrollPopup.style.top = `${topPos}%`;
        }

        window.addEventListener('scroll', () => {
            if (listContainer.children.length === 0) return;
            updatePopupDate();
            updatePopupPosition();
        });

        function handleDragStart(e) {
            if (listContainer.children.length === 0) return;
            isDragging = true;
            scrollPopup.classList.add('dragging'); 
            updatePopupDate();
        }

        function handleDragMove(e) {
            if (!isDragging) return;
            e.preventDefault(); 
            
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const windowH = window.innerHeight;
            
            let percent = (clientY - (windowH * 0.15)) / (windowH * 0.7);
            percent = Math.max(0, Math.min(1, percent));
            
            scrollPopup.style.top = `${15 + percent * 70}%`;
            
            const scrollableHeight = document.documentElement.scrollHeight - window.innerHeight;
            window.scrollTo(0, scrollableHeight * percent);
            
            updatePopupDate();
        }

        function handleDragEnd() {
            if (!isDragging) return;
            isDragging = false;
            scrollPopup.classList.remove('dragging');
        }

        scrollPopup.addEventListener('touchstart', handleDragStart, { passive: false });
        document.addEventListener('touchmove', handleDragMove, { passive: false });
        document.addEventListener('touchend', handleDragEnd);
        
        scrollPopup.addEventListener('mousedown', handleDragStart);
        document.addEventListener('mousemove', handleDragMove);
        document.addEventListener('mouseup', handleDragEnd);
    </script>
</body>

        function render() {
            const container = document.getElementById('listContainer');
            
            container.innerHTML = studyData.map(day => `
                <div class="bg-slate-800 rounded-[2rem] p-6 md:p-10 shadow-sm border border-slate-700">
                    <div class="flex justify-between items-center mb-6">
                        <span class="bg-blue-900 text-blue-200 px-4 py-1 rounded-full text-xs font-bold uppercase tracking-wider">Day ${day.day}</span>
                        <span class="text-sm text-slate-400 font-medium">${day.date}</span>
                    </div>
                    
                    <h2 class="text-xl font-bold text-center text-slate-100 mb-8 italic">"${day.topic}"</h2>
                    
                    <div class="grid grid-cols-3 gap-3 mb-10">
                        ${(day.items || []).map(item => `
                            <div class="vocab-box" onclick="this.classList.toggle('active')">
                                <span class="text-blue-400 font-bold text-sm md:text-base leading-tight">${item.exp}</span>
                                <div class="hidden-content text-left">
                                    <p class="text-xs font-bold text-slate-200 mb-1">${item.mean}</p>
                                    <p class="text-[10px] text-slate-300 italic font-mono leading-relaxed bg-slate-700 p-2 rounded-lg">${item.ex}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="space-y-8">
                        ${day.dialogue && day.dialogue.length > 0 ? `
                        <section>
                            <h3 class="section-title text-base">🗨️ Dialogue</h3>
                            <div class="bg-slate-700 p-5 rounded-2xl space-y-4 border border-slate-600">
                                ${day.dialogue.map(d => `
                                    <div class="flex gap-3">
                                        <span class="font-bold text-xs ${d.spk === 'Jini' ? 'text-pink-400' : 'text-blue-400'} w-10 shrink-0">${d.spk}</span>
                                        <div class="text-sm">
                                            <p class="text-slate-200 font-semibold">${d.en}</p>
                                            <p class="text-slate-400 text-xs mt-1">${d.ko}</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </section>` : ''}

                        ${day.feedback && day.feedback.length > 0 ? `
                        <section>
                            <h3 class="section-title text-base">🎙️ Pronunciation & Feedback</h3>
                            <ul class="list-disc list-inside text-sm text-slate-300 space-y-2 px-2 leading-relaxed">
                                ${day.feedback.map(f => `<li>${f}</li>`).join('')}
                            </ul>
                        </section>` : ''}

                        <section class="pt-6 border-t border-dashed border-slate-600">
                            <div class="text-center">
                                <p class="text-orange-400 text-sm font-medium">💡 ${day.closing}</p>
                            </div>
                        </section>
                    </div>
                </div>
            `).join('');
        }

        // 박스 클릭 핸들러
        document.addEventListener('click', function(e) {
            const box = e.target.closest('.vocab-box');
            if (box) {
                const content = box.querySelector('.hidden-content');
                content.style.display = box.classList.contains('active') ? 'block' : 'none';
            }
        });

        render();
    </script>
